# Builds the site with Astro and publishes it to GitHub Pages on every push to
# main. One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ffprobe reads clip sizes so the pages reserve their space while loading.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
